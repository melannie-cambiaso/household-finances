name: CI

# Required by the protection rule of `main`: the job names below are the check
# names it waits for. Renaming a job means updating that rule.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request makes the older run useless; never cancel the
  # run of a merge into main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      # The integration tests skip themselves without TEST_DATABASE_URL; they run
      # in the "Tests (Postgres)" job.
      - name: Unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fake values, not secrets: the build never connects to the database or to
    # Google. The code only needs the variables to exist when it is imported.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-build-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-fake-client-id
      GOOGLE_CLIENT_SECRET: ci-fake-client-secret
      ALLOWED_EMAILS: ci@example.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  database:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Postgres that only lives during this run: nothing here touches
    # the real database or the Neon test branch.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # From an empty database, so this also proves the migrations apply from zero.
      - name: Apply the migrations
        run: pnpm db:migrate

      - name: Full test suite
        run: |
          set -o pipefail
          pnpm test | tee test-output.txt

      # A skipped suite does not fail the run, so a misconfigured database would
      # leave this job green without testing anything.
      - name: Check that the integration tests really ran
        run: |
          grep -q "✔ transfer service" test-output.txt
          grep -q "✔ savings service" test-output.txt
